<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3038"/>
      <stop offset="100%" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#8f6a1f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#floor)"/>
  <!-- workshop wall -->
  <rect x="0" y="0" width="1600" height="520" fill="#1a1e24"/>
  <g stroke="#3a424c" stroke-width="2" opacity="0.55">
    <path d="M0 120 H1600"/>
    <path d="M0 240 H1600"/>
    <path d="M0 360 H1600"/>
    <path d="M180 0 V520"/>
    <path d="M420 0 V520"/>
    <path d="M720 0 V520"/>
    <path d="M1040 0 V520"/>
    <path d="M1320 0 V520"/>
  </g>
  <!-- hanging tools silhouettes -->
  <g fill="url(#brass)" opacity="0.85">
    <rect x="980" y="160" width="18" height="210" rx="2"/>
    <path d="M955 160 h68 l-10 28 h-48z"/>
    <rect x="1180" y="140" width="14" height="250" rx="2"/>
    <circle cx="1187" cy="130" r="22"/>
    <path d="M1320 200 c40 -60 90 -60 130 0 v24 c-40 -48 -90 -48 -130 0z"/>
    <rect x="1370" y="220" width="16" height="200" rx="2"/>
  </g>
  <!-- workbench -->
  <rect x="720" y="520" width="820" height="28" fill="#3a424c"/>
  <rect x="760" y="548" width="28" height="220" fill="#2a3038"/>
  <rect x="1480" y="548" width="28" height="220" fill="#2a3038"/>
  <!-- bolts scattered -->
  <g fill="#b8872c" opacity="0.7">
    <circle cx="860" cy="500" r="10"/>
    <circle cx="920" cy="508" r="7"/>
    <circle cx="1100" cy="496" r="9"/>
    <circle cx="1260" cy="505" r="6"/>
  </g>
  <!-- light beam -->
  <ellipse cx="1200" cy="280" rx="280" ry="160" fill="#d4a84b" opacity="0.07"/>
</svg>
